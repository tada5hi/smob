<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="smob-title smob-desc">
<title id="smob-title">Leftmost values win and arrays concatenate</title><desc id="smob-desc">merge combines the left source containing port 3000, db.host local and tags app with the right source containing port 80, db.pool 5 and tags defaults. The result keeps port 3000, combines db properties and concatenates tags in left-to-right order.</desc>
<style>:root{--panel:#f7f8fc;--card:#ffffff;--text:#20283d;--muted:#526078;--line:#5d50af;--accent:#5d50af}@media(prefers-color-scheme:dark){:root{--panel:#121a28;--card:#1d293c;--text:#edf3ff;--muted:#bccade;--line:#b0a6ff;--accent:#b0a6ff}}text{font-family:Arial,sans-serif;fill:var(--text)}.label{font-size:17px;fill:var(--muted)}.heading{font-size:22px;font-weight:700}.code{font-family:monospace;font-size:18px}.card{fill:var(--card);stroke:var(--line);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#smob-arrow)}</style>
<defs><marker id="smob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs>
<rect x="2" y="2" width="956" height="356" rx="20" fill="var(--panel)"/>
<text x="30" y="42" class="heading">Default merge: leftmost values win, nested objects combine</text>
<rect x="30" y="75" width="300" height="170" rx="12" class="card"/><text x="50" y="108" class="heading">Your configuration</text><text x="50" y="145" class="code">port: 3000</text><text x="50" y="180" class="code">db: { host: 'local' }</text><text x="50" y="215" class="code">tags: ['app']</text>
<rect x="30" y="265" width="300" height="65" rx="12" class="card"/><text x="50" y="293" class="label">Defaults: port 80, db.pool 5,</text><text x="50" y="317" class="label">tags ['defaults']</text>
<path d="M330 160H405V195M330 298H405V195" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M405 195H475" class="arrow"/>
<rect x="480" y="75" width="445" height="255" rx="12" class="card"/><text x="500" y="108" class="heading">merge(config, defaults)</text><text x="500" y="150" class="code">port: 3000</text><text x="500" y="188" class="code">db: { host: 'local', pool: 5 }</text><text x="500" y="226" class="code">tags: ['app', 'defaults']</text><text x="500" y="270" class="label">New top-level result; nested references</text><text x="500" y="297" class="label">can remain shared unless clone is true.</text>
</svg>